name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Daily 8pm ET, plus Sun/Thu 11:30pm ET (UTC; EST-oriented)
    - cron: "0 1 * 9-12,1 *" # Daily 8pm EST → 01:00 UTC
    - cron: "30 4 * 9-12,1 1,5" # Sun/Thu 11:30pm EST → 04:30 UTC Mon/Fri
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Refresh standings on schedule / manual runs only (push deploys committed data)
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
      ESPN_SEASON_ID: ${{ vars.ESPN_SEASON_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: pip install -r backend/requirements.txt

      - name: Run median script
        run: python backend/median-np.py

      - name: Upload standings data
        uses: actions/upload-artifact@v4
        with:
          name: standings-data
          path: |
            app/standings.json
            app/metadata.json

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/standings.json app/metadata.json backend/archive/
          if git diff --staged --quiet; then
            echo "No standings changes to commit"
          else
            git commit -m "Automated median update"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated standings
        if: needs.update.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: standings-data
          path: app/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npx --no-install next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
